<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درب عقلك | MIND FORGE</title>

    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================
         1. الواجهة الرئيسية
         ============================================ -->
    <div id="home-screen" class="screen">

        <!-- رأس المنصة -->
        <div class="brand-header">

            <!-- اللوغو: MF + رسمة خفيفة -->
            <div class="logo-wrap">
                <svg class="logo-mf" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="gradMF" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#7C3AED"/>
                            <stop offset="100%" stop-color="#EC4899"/>
                        </linearGradient>
                        <linearGradient id="gradRing" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
                            <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
                        </linearGradient>
                    </defs>

                    <!-- دائرة خفيفة خلف MF -->
                    <circle cx="80" cy="80" r="62"
                            stroke="url(#gradRing)"
                            stroke-width="3"
                            fill="none"
                            stroke-dasharray="4 8"
                            opacity="0.7"/>

                    <!-- حلقة خارجية رقيقة -->
                    <circle cx="80" cy="80" r="72"
                            stroke="url(#gradRing)"
                            stroke-width="1.5"
                            fill="none"
                            opacity="0.35"/>

                    <!-- نقاط ملونة على المحيط -->
                    <circle cx="80" cy="18" r="4" fill="#7C3AED"/>
                    <circle cx="142" cy="80" r="4" fill="#EC4899"/>
                    <circle cx="80" cy="142" r="4" fill="#7C3AED"/>
                    <circle cx="18" cy="80" r="4" fill="#EC4899"/>

                    <!-- حرف M -->
                    <path d="M 42 105 L 42 55 L 62 80 L 80 55 L 80 105"
                          stroke="url(#gradMF)"
                          stroke-width="7"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          fill="none"/>

                    <!-- حرف F -->
                    <path d="M 96 55 L 96 105 M 96 55 L 124 55 M 96 78 L 118 78"
                          stroke="url(#gradMF)"
                          stroke-width="7"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          fill="none"/>
                </svg>
            </div>

            <!-- الاسم -->
            <div class="brand-text">
                <h1 class="brand-title">درب عقلك</h1>
                <p class="brand-subtitle">MIND FORGE</p>
            </div>
        </div>

        <!-- اختيار الفئة -->
        <h2 class="section-title">اختر الفئة العمرية</h2>

        <div class="age-cards">
            <button class="age-card" onclick="selectAge('over16')" type="button">
                <span class="age-card-top">فوق</span>
                <span class="age-card-num">16</span>
                <span class="age-card-bot">سنة</span>
            </button>

            <button class="age-card" onclick="selectAge('under16')" type="button">
                <span class="age-card-top">تحت</span>
                <span class="age-card-num">16</span>
                <span class="age-card-bot">سنة</span>
            </button>
        </div>

        <!-- توقيع المطور -->
        <div class="signature">
            <p class="sig-name">قُصي الفندي</p>
            <p class="sig-role">تخصص الذكاء الاصطناعي وعلوم البيانات</p>
            <div class="sig-social">
                <a href="https://www.instagram.com/qusai.alfandi" target="_blank" rel="noopener" class="sig-btn instagram">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                    إنستغرام
                </a>
                <a href="https://www.facebook.com/qusai.alzoupi.578008" target="_blank" rel="noopener" class="sig-btn facebook">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    فيسبوك
                </a>
            </div>
        </div>

        <!-- لوحة الإحصائيات -->
        <div class="stats-board">
            <h3 class="stats-title">مجموعك الكلي</h3>
            <div class="stats-score">
                <span class="stats-current" id="stats-current">0</span>
                <span class="stats-divider">/</span>
                <span class="stats-total" id="stats-total">0</span>
            </div>
            <div class="stats-bar">
                <div class="stats-bar-fill" id="stats-bar-fill"></div>
            </div>
            <p class="stats-percent" id="stats-percent">0%</p>

            <div class="stats-bottom">
                <div class="stats-item">
                    <span class="stats-label">أعلى لعبة</span>
                    <span class="stats-value" id="stats-best">—</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">أقل لعبة</span>
                    <span class="stats-value" id="stats-worst">—</span>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================
         2. لوحة الألعاب
         ============================================ -->
    <div id="games-screen" class="screen hidden">

        <div class="games-header">
            <h2 class="games-title">لوحة الألعاب</h2>
            <button class="back-btn" onclick="goHome()" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <path d="M19 12H5"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                الرئيسية
            </button>
        </div>

        <p class="games-intro">اختر التحدي الإدراكي</p>
        <p class="games-desc">كل لعبة مصممة لتقوية مهارة ذهنية محددة</p>

        <div id="games-grid" class="games-grid"></div>

    </div>

    <!-- ============================================
         3. شاشة اللعبة
         ============================================ -->
    <div id="game-modal" class="modal hidden">
        <div class="modal-box">
            <button class="modal-close" onclick="closeGame()" type="button" aria-label="إغلاق">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div id="game-content" class="game-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
